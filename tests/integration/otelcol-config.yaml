#
# otelcol configuration for the otlp-c integration test.
# Receives OTLP/HTTP traces on :4318 and exports them to a local
# Jaeger all-in-one container via OTLP gRPC on jaeger:4317.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  # Debug exporter prints received metrics/logs to stderr — the CI
  # job greps the otelcol container logs to verify our metrics and
  # logs encoders produced parseable output (end-to-end validation
  # without needing a metrics/logs backend like Prometheus/Loki).
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [otlp/jaeger]
    metrics:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [debug]
    logs:
      receivers:  [otlp]
      processors: [memory_limiter, batch]
      exporters:  [debug]
