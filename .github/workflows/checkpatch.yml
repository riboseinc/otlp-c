name: checkpatch

on:
  pull_request:
    branches: [main]

jobs:
  checkpatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base ref
        run: git fetch origin ${{ github.base_ref }}:base

      - name: Install checkpatch
        run: |
          # Same checkpatch install as retrace for consistency.
          mkdir -p $HOME/checkpatch
          cd $HOME/checkpatch
          curl -sSL https://github.com/torvalds/linux/raw/master/scripts/checkpatch.pl -o checkpatch.pl
          curl -sSL https://github.com/torvalds/linux/raw/master/scripts/spelling.txt -o spelling.txt
          chmod +x checkpatch.pl

      - name: Run checkpatch
        run: |
          base_sha=$(git rev-parse base)
          head_sha=$(git rev-parse HEAD)
          echo "Checking $base_sha..$head_sha"
          git format-patch -M -p --no-signature --no-encode-email-headers \
            -o /tmp/patches "$base_sha..$head_sha"

          ignore_list=(
            --ignore ARRAY_SIZE
            --ignore AVOID_EXTERNS
            --ignore BRACES
            --ignore OPEN_BRACE
            --ignore ELSE_AFTER_BRACE
            --ignore NESTED_BRACE
            --ignore BLOCK_COMMENT_STYLE
            --ignore COMMIT_LOG_LONG_LINE
            --ignore COMPLEX_MACRO
            --ignore EMAIL_SUBJECT
            --ignore EMBEDDED_FILENAME
            --ignore EXECUTE_PERMISSIONS
            --ignore FILE_PATH_CHANGES
            --ignore GLOBAL_INITIALISERS
            --ignore INITIALISE_STATIC
            --ignore LONG_LINE
            --ignore LONG_LINE_COMMENT
            --ignore LONG_LINE_STRING
            --ignore MISSING_SIGN_OFF
            --ignore MULTISTATEMENT_MACRO_USE_DO_WHILE
            --ignore NAKED_SSCANF
            --ignore NEW_TYPEDEFS
            --ignore PREFER_ALIGNED
            --ignore PREFER_DEFINED_ATTRIBUTE_MACRO
            --ignore PREFER_FALLTHROUGH
            --ignore RETURN_PARENTHESES
            --ignore SPDX_LICENSE_TAG
            --ignore SPLIT_STRING
            --ignore SSCANF_TO_KSTRTO
            --ignore STATIC_CONST_CHAR_ARRAY
            --ignore STORAGE_CLASS
            --ignore STRCPY
            --ignore STRNCPY
            --ignore SYMBOLIC_PERMS
            --ignore TRAILING_SEMICOLON
            --ignore USE_FUNC
            --ignore DEEP_INDENTATION
            --no-tree
          )

          rc=0
          for patch in /tmp/patches/*.patch; do
            [ -f "$patch" ] || continue
            perl $HOME/checkpatch/checkpatch.pl "${ignore_list[@]}" "$patch" || rc=1
          done
          exit $rc
