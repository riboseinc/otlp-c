name: Soak

# The 100k-iteration property soak, mechanized. CPU-side tests
# carry the `soak` label (TIMEOUT 600, enough for 100k); wall-clock
# `timing` tests stay at their default 1000 iterations — that IS
# their soak (docs/roadmap.md, v1.0.4 protocol).
#
# One registration helper (otlp_add_property_test) owns the labels
# and timeouts — adding a soak-capable property is automatic.

on:
  schedule:
    - cron: "0 3 * * 0" # Sundays 03:00 UTC
  workflow_dispatch:

permissions:
  issues: write

jobs:
  soak:
    name: "100k property soak (ctest -L soak)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build the property suite
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
          cmake --build build
      - name: Soak at 100k iterations
        env:
          OTLP_C_PROPERTY_ITERS: "100000"
        run: |
          ctest --test-dir build -L soak --output-on-failure
      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh issue create \
            --title "Weekly soak FAILED ($(date -u +%F))" \
            --body "The 100k property soak failed. Run: $run_url — reproduce locally with OTLP_C_PROPERTY_ITERS=100000 ctest --test-dir build -L soak (or OTLP_C_PROPERTY_SEED=<seed> against the failed binary)." \
            --label ci
