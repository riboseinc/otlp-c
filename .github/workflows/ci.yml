name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 gcc
            os: ubuntu-24.04
            cc: gcc
          - name: Linux x64 clang
            os: ubuntu-24.04
            cc: clang
          - name: Linux ARM64 gcc
            os: ubuntu-24.04-arm
            cc: gcc
          - name: macOS Intel
            os: macos-15-intel
            cc: clang
          - name: macOS ARM64
            os: macos-14
            cc: clang
          - name: Windows x64 MSVC
            os: windows-2022
            cc: cl
            msvc: true
          - name: Windows ARM64 MSVC
            os: windows-11-arm
            cc: cl
            msvc: true

    # All matrix entries have real CI runners now (was previously
    # continue-on-error for ARM64 due to MSVC atomics + slow runner;
    # both fixed in v0.5.1). Failure of any platform gates the PR.
    # Windows ARM64 runner is occasionally slow to allocate but the
    # build itself is sound when it gets a runner.

    steps:
      - uses: actions/checkout@v4

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        if: matrix.msvc == true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
          # Pin to VS 2022 stable. VS 18 Enterprise (preview) breaks
          # C11 atomics — see release.yml for full comment.
          vsversion: 2022

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Ninja Multi-Config" -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  alpine-musl:
    name: Alpine ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: alpine:3.21
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        if: matrix.arch == 'x64'
      - uses: taiki-e/checkout-action@v1
        if: matrix.arch == 'arm64'
      - name: Install deps
        run: apk add cmake ninja gcc g++ musl-dev linux-headers
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  freebsd:
    name: FreeBSD 14.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        continue-on-error: true  # INADDR_LOOPBACK visibility quirk; revisit
        with:
          release: 14.2
          usesh: true
          prepare: pkg install -y cmake ninja gcc
          run: |
            set -e
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with ASAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_ASAN=ON
          cmake --build build
      - name: Test with ASAN
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with UBSAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_UBSAN=ON
          cmake --build build
      - name: Test with UBSAN
        env:
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with TSAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_TSAN=ON
          cmake --build build
      - name: Test with TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  cmake-integration:
    name: CMake find_package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    # Linux + macOS find_package works (LIBDIR pinned to "lib" so
    # config lands at <prefix>/lib/cmake/otlp-c/). Windows has a
    # bash-on-Windows path mangling issue in the consumer-test step
    # CMAKE_INSTALL_LIBDIR pinned to "lib" so install path is
    # deterministic on all platforms. Uses $GITHUB_WORKSPACE env var
    # (forward slashes) instead of ${{ github.workspace }} (Windows
    # backslashes mangled by bash).
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - name: Build and install otlp-c
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          cmake --build build --config Release
          cmake --install build --config Release
      - name: Test find_package consumer
        shell: bash
        run: |
          mkdir -p consumer-test && cd consumer-test
          cat > main.c << 'EOF'
          #include <otlp-c/otlp.h>
          #include <stdio.h>
          int main(void) { printf("%s\n", otlp_version()); return 0; }
          EOF
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer C)
          find_package(otlp-c CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE otlp-c::otlp_c)
          enable_testing()
          add_test(NAME consumer_test COMMAND consumer)
          EOF
          cmake -B build -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --build-config Release --output-on-failure

  # The FetchContent path documented in README/quickstart. Pins two
  # things: (1) an embedded otlp-c builds, links, and runs from a
  # consumer project; (2) it is side-effect-free — the consumer's
  # CMAKE_INSTALL_LIBDIR cache entry must survive MakeAvailable
  # (the CACHE ... FORCE pin clobbered it before v0.6.9) and no
  # CPack config may appear in the consumer's build tree.
  fetchcontent-consumer:
    name: CMake FetchContent consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - name: Test FetchContent consumer
        shell: bash
        run: |
          mkdir -p consumer-test && cd consumer-test
          cat > main.c << 'EOF'
          #include <otlp-c/otlp.h>
          #include <stdio.h>
          int main(void) {
              otlp_exporter_opts_t opts = { .service_name = "consumer" };
              otlp_exporter_t *exp = otlp_exporter_create(&opts);
              otlp_exporter_set_null_transport(exp, 1);
              otlp_tracer_t *tr = otlp_tracer_create("c", "c", "0");
              otlp_span_t *s = otlp_tracer_start_span(tr, "fc");
              otlp_span_mark_end(s);
              otlp_exporter_emit(exp, s);
              otlp_exporter_flush(exp);
              otlp_span_free(s);
              otlp_tracer_free(tr);
              otlp_exporter_free(exp);
              printf("otlp-c %s round-trip ok\n", otlp_version());
              return 0;
          }
          EOF
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer C)
          set(CMAKE_INSTALL_LIBDIR "lib/consumer-check" CACHE PATH "")
          include(FetchContent)
          # TO_CMAKE_PATH: on Windows $ENV{GITHUB_WORKSPACE} carries
          # backslashes, which FetchContent embeds verbatim into the
          # subbuild CMakeLists — "\a" parses as an invalid escape.
          file(TO_CMAKE_PATH "$ENV{GITHUB_WORKSPACE}" OTLP_C_SOURCE_DIR)
          FetchContent_Declare(otlp-c SOURCE_DIR "${OTLP_C_SOURCE_DIR}")
          FetchContent_MakeAvailable(otlp-c)
          if(NOT "${CMAKE_INSTALL_LIBDIR}" STREQUAL "lib/consumer-check")
              message(FATAL_ERROR
                  "otlp-c clobbered CMAKE_INSTALL_LIBDIR: ${CMAKE_INSTALL_LIBDIR}")
          endif()
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE otlp-c::otlp_c)
          enable_testing()
          add_test(NAME consumer_test COMMAND consumer)
          EOF
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          if ls build/CPackConfig.cmake >/dev/null 2>&1; then
              echo "FAIL: CPack config leaked into consumer build tree"
              exit 1
          fi
          ctest --test-dir build --build-config Release --output-on-failure

  # End-to-end integration against a real otelcol + Jaeger.
  # Validates the wire-format fixes (v0.5.48 Event/Status field
  # numbers, v0.5.49 ExpHistogram wire types, v0.5.50 LogRecord
  # trace correlation) against a spec-compliant collector — the
  # property tests verify the wire bytes directly, but this job
  # verifies the full round-trip: encode → POST → otelcol decode
  # → Jaeger store → query API.
  jaeger-integration:
    name: Jaeger integration (otelcol end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build library + tests
        run: |
          cmake -B build -G Ninja -DOTLP_C_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Start otelcol + Jaeger
        working-directory: tests/integration
        run: |
          docker compose up -d
          # Wait for both services to be healthy (up to 30s).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:16686/api/services > /dev/null 2>&1; then
              echo "Jaeger ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Jaeger did not become ready in 30s"
          docker compose logs
          exit 1
      - name: Run integration test
        env:
          OTLP_C_RUN_INTEGRATION: "1"
        run: ctest --test-dir build -L integration --output-on-failure
      - name: Verify metrics + logs received by otelcol
        working-directory: tests/integration
        run: |
          # The test's flush_metric/flush_log assert a 2xx from
          # otelcol (the collector parsed our protobuf). This step
          # additionally greps the debug-exporter output to confirm
          # the metric name and log body arrived intact — the batch
          # processor may hold them for up to 5s, so retry.
          for i in $(seq 1 15); do
            if docker compose logs otelcol | grep -q "integration_requests_total"; then
              echo "metric received by otelcol (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "metric 'integration_requests_total' not found in otelcol logs"
          docker compose logs otelcol | tail -50
          exit 1
      - name: Verify log record received by otelcol
        working-directory: tests/integration
        run: |
          for i in $(seq 1 15); do
            if docker compose logs otelcol | grep -q "integration log body"; then
              echo "log record received by otelcol (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "log 'integration log body' not found in otelcol logs"
          docker compose logs otelcol | tail -50
          exit 1
      - name: Dump otelcol logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs
      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
