name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 gcc
            os: ubuntu-24.04
            cc: gcc
          - name: Linux x64 clang
            os: ubuntu-24.04
            cc: clang
          - name: Linux ARM64 gcc
            os: ubuntu-24.04-arm
            cc: gcc
          - name: macOS Intel
            os: macos-15-intel
            cc: clang
          - name: macOS ARM64
            os: macos-14
            cc: clang
          - name: Windows x64 MSVC
            os: windows-2022
            cc: cl
            msvc: true
          - name: Windows ARM64 MSVC
            os: windows-11-arm
            cc: cl
            msvc: true

    # All matrix entries have real CI runners now (was previously
    # continue-on-error for ARM64 due to MSVC atomics + slow runner;
    # both fixed in v0.5.1). Failure of any platform gates the PR.
    # Windows ARM64 runner is occasionally slow to allocate but the
    # build itself is sound when it gets a runner.

    steps:
      - uses: actions/checkout@v4

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        if: matrix.msvc == true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}
          # Pin to VS 2022 stable. VS 18 Enterprise (preview) breaks
          # C11 atomics — see release.yml for full comment.
          vsversion: 2022

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Ninja Multi-Config" -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  alpine-musl:
    name: Alpine ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: alpine:3.21
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        if: matrix.arch == 'x64'
      - uses: taiki-e/checkout-action@v1
        if: matrix.arch == 'arm64'
      - name: Install deps
        run: apk add cmake ninja gcc g++ musl-dev linux-headers
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  freebsd:
    name: FreeBSD 14.2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        # A real gate since v1.1.3. The old continue-on-error was
        # masking failures in the jobs API (a masked step's
        # conclusion reads "success"); removing it exposed real
        # portability bugs, fixed via tests/test_portable.h.
        with:
          release: 14.2
          usesh: true
          prepare: pkg install -y cmake ninja gcc
          run: |
            set -e
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure

  asan:
    name: AddressSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with ASAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_ASAN=ON
          cmake --build build
      - name: Test with ASAN
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with UBSAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_UBSAN=ON
          cmake --build build
      - name: Test with UBSAN
        env:
          UBSAN_OPTIONS: print_stacktrace=1:abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build with TSAN
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_ENABLE_TSAN=ON
          cmake --build build
      - name: Test with TSAN
        env:
          TSAN_OPTIONS: abort_on_error=1
        run: ctest --test-dir build --output-on-failure

  cmake-integration:
    name: CMake find_package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    # LIBDIR pinned to "lib" at top level so the installed config
    # lands deterministically at <prefix>/lib/cmake/otlp-c on every
    # platform. Uses $GITHUB_WORKSPACE (forward slashes) instead of
    # ${{ github.workspace }} (Windows backslashes mangled by bash).
    # The consumer itself is a standalone project in
    # tests/consumers/find_package (runnable locally, see
    # tests/consumers/README.md).
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - name: Build and install otlp-c
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/install"
          cmake --build build --config Release
          cmake --install build --config Release
      - name: Test find_package consumer
        shell: bash
        run: |
          # The consumer project is a real standalone CMake project
          # in tests/consumers/find_package — same code CI and local
          # devs run (see tests/consumers/README.md).
          cmake -S tests/consumers/find_package -B consumer-build \
            -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/install" -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer-build --config Release
          ctest --test-dir consumer-build --build-config Release --output-on-failure

  # The FetchContent path documented in README/quickstart, exercised
  # by the standalone consumer project in tests/consumers/fetchcontent
  # (ubuntu + windows). The consumer asserts both that an embedded
  # otlp-c builds, links, and runs, and that it is side-effect-free:
  # its CMAKE_INSTALL_LIBDIR cache entry must survive MakeAvailable
  # (the CACHE ... FORCE pin clobbered it before v0.6.9) and no CPack
  # config may appear in its build tree.
  fetchcontent-consumer:
    name: CMake FetchContent consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: 2022
      - name: Test FetchContent consumer
        shell: bash
        run: |
          cmake -S tests/consumers/fetchcontent -B consumer-build \
            -DOTLP_C_SOURCE_DIR="$GITHUB_WORKSPACE" -DCMAKE_BUILD_TYPE=Release
          cmake --build consumer-build --config Release
          ctest --test-dir consumer-build --build-config Release --output-on-failure

  # The website (v1.1.0): an Astro 7 + Vite 8 + Tailwind 4 +
  # Vue-islands site (home / about / audiences / use cases / docs /
  # examples) with the generated Doxygen reference nested at /api/.
  # The marketing pages are hand-written; the API reference is
  # generated — the two halves cannot drift apart because they
  # deploy together.
  pages:
    name: Website (Astro + Doxygen -> GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build the site + reference
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q doxygen graphviz
          cmake -B build-docs
          cmake --build build-docs --target docs
          cd website
          npm ci
          npm run build
          cp -r ../build-docs/docs/html dist/api
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist
      - uses: actions/deploy-pages@v4

  # Coverage floor (v1.0.4): every library file must hold >= 82%
  # region coverage. The bar was a repo convention that drifted
  # unnoticed once (v0.6.2 re-measurement) - now it gates.
  coverage:
    name: Coverage (82% per-file floor)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Install clang/llvm tooling
        run: sudo apt-get update -q && sudo apt-get install -y -q clang llvm
      - name: Build instrumented (clang — the coverage flags are clang-only)
        run: |
          export CC=clang
          cmake --preset coverage
          cmake --build --preset coverage
      - name: Run tests + gather
        working-directory: build-cov
        run: |
          find . -name '*.profraw' -delete
          LLVM_PROFILE_FILE="%h-%p.profraw" ctest --output-on-failure
          llvm-profdata merge -sparse $(find . -name '*.profraw') -o coverage.profdata
          llvm-cov report libotlp_c.a -instr-profile=coverage.profdata | tee report.txt
      - name: Enforce the floor
        run: |
          python3 - <<'EOF'
          import re, sys
          bad = []
          for line in open("build-cov/report.txt"):
              m = re.match(r"(src/\S+|include/\S+)\s+", line)
              if not m:
                  continue
              cols = line.split()
              # regions: cols[1]=total cols[2]=missed cols[3]=pct
              try:
                  pct = float(cols[3].rstrip("%"))
              except (ValueError, IndexError):
                  continue
              if pct < 82.0:
                  bad.append((cols[0], pct))
          if bad:
              for f, p in bad:
                  print(f"BELOW FLOOR: {f} {p:.2f}% < 82%")
              sys.exit(1)
          print("coverage floor held: every file >= 82%")
          EOF

  # Conformance gates (v1.0.2): every schema table diffed against
  # the INSTALLED opentelemetry-proto descriptors, and the
  # checked-in golden vectors regenerated and byte-compared - so
  # schema drift, stale fixtures, and upstream proto changes all
  # fail here. Manual tools become CI-enforced.
  examples:
    name: Examples build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build the demo programs
        run: |
          cmake -B build -G Ninja -DOTLP_C_BUILD_EXAMPLES=ON
          cmake --build build

  bench-smoke:
    name: Bench smoke (anti-blowup ceiling)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest
      - name: Build benchmarks
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_BENCH=ON
          cmake --build build
      - name: Emit pipeline under a generous ceiling
        run: |
          # Not a precision gate: shared runners are noisy. This
          # catches algorithmic blowups (~20x the Apple-silicon
          # median of ~150 ns/span), not regressions in the noise.
          out=$(./build/bench/otlp_bench_emit)
          echo "$out"
          ns=$(echo "$out" | awk '/spans=1000   attrs=0/ {print $3; exit}')
          echo "emit 0-attrs: $ns ns/span (ceiling 3000)"
          python3 -c "import sys; sys.exit(0 if float('$ns' or 999999) < 3000 else 1)"

  conformance-gates:
    name: Conformance gates (descriptor audit + goldens)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference protobufs
        run: pip install opentelemetry-proto==1.44.0
      - name: Audit schema tables against descriptors
        run: python tests/golden/audit_tables.py
      - name: Golden vectors match the reference serialization
        run: |
          python tests/golden/generate.py
          git diff --exit-code --stat -- tests/golden/
      - name: Docs/site sync (quartet, changelogs, env-var parity)
        run: python tests/site_docs_sync.py
      - name: Include graph matches ADR 0006's record
        run: python tests/include_lint.py
      - name: Gates self-test (every check branch proven to fail)
        run: python tests/gates_selftest.py

  # The in-repo vcpkg overlay port (ports/otlp-c). Until v0.6.15
  # this recipe had never been built once - pinned at v0.5.17 with
  # a placeholder SHA, and missing the vcpkg-cmake-config host
  # dependency (vcpkg_cmake_config_fixup was an unknown command).
  # This job pins it: a manifest consumer installs otlp-c through
  # the overlay and runs an emit-to-flush round trip. The portfile
  # builds the LOCAL checkout, so the recipe cannot drift behind
  # the releases.
  vcpkg-overlay-consumer:
    name: vcpkg overlay consumer (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Test vcpkg overlay consumer
        shell: bash
        run: |
          cmake -S tests/consumers/vcpkg_overlay -B consumer-build \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_OVERLAY_PORTS="$GITHUB_WORKSPACE/ports"
          cmake --build consumer-build
          ctest --test-dir consumer-build --output-on-failure

  # End-to-end integration against a real otelcol + Jaeger.
  # Validates the wire-format fixes (v0.5.48 Event/Status field
  # numbers, v0.5.49 ExpHistogram wire types, v0.5.50 LogRecord
  # trace correlation) against a spec-compliant collector — the
  # property tests verify the wire bytes directly, but this job
  # verifies the full round-trip: encode → POST → otelcol decode
  # → Jaeger store → query API.
  jaeger-integration:
    name: Jaeger integration (otelcol end-to-end)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Build library + tests
        run: |
          cmake -B build -G Ninja -DOTLP_C_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build
      - name: Start otelcol + Jaeger
        working-directory: tests/integration
        run: |
          docker compose up -d
          # Wait for both services to be healthy (up to 30s).
          for i in $(seq 1 30); do
            if curl -sf http://localhost:16686/api/services > /dev/null 2>&1; then
              echo "Jaeger ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Jaeger did not become ready in 30s"
          docker compose logs
          exit 1
      - name: Run integration test
        env:
          OTLP_C_RUN_INTEGRATION: "1"
        run: ctest --test-dir build -L integration --output-on-failure
      - name: Verify metrics + logs received by otelcol
        working-directory: tests/integration
        run: |
          # The test's flush_metric/flush_log assert a 2xx from
          # otelcol (the collector parsed our protobuf). This step
          # additionally greps the debug-exporter output to confirm
          # the metric name and log body arrived intact — the batch
          # processor may hold them for up to 5s, so retry.
          for i in $(seq 1 15); do
            if docker compose logs otelcol | grep -q "integration_requests_total"; then
              echo "metric received by otelcol (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "metric 'integration_requests_total' not found in otelcol logs"
          docker compose logs otelcol | tail -50
          exit 1
      - name: Verify log record received by otelcol
        working-directory: tests/integration
        run: |
          for i in $(seq 1 15); do
            if docker compose logs otelcol | grep -q "integration log body"; then
              echo "log record received by otelcol (attempt $i)"
              exit 0
            fi
            sleep 1
          done
          echo "log 'integration log body' not found in otelcol logs"
          docker compose logs otelcol | tail -50
          exit 1
      - name: Dump otelcol logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs
      - name: Tear down
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
