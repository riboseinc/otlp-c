name: CI

permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 gcc
            os: ubuntu-latest
            cc: gcc
          - name: Linux x64 clang
            os: ubuntu-latest
            cc: clang
          - name: Linux ARM64 gcc
            os: ubuntu-24.04-arm
            cc: gcc
          - name: macOS Intel
            os: macos-13
            cc: clang
          - name: macOS ARM64
            os: macos-14
            cc: clang
          - name: Windows x64 MSVC
            os: windows-2022
            cc: cl
            msvc: true
          - name: Windows ARM64 MSVC
            os: windows-11-arm
            cc: cl
            msvc: true

    # windows-11-arm runner is slow to spin up; MSVC stdatomic.h
    # support is brittle on preview VS toolchains. Allow Windows
    # failures to not gate the rest of CI; revisit after 0.1.0.
    continue-on-error: ${{ contains(matrix.os, 'windows') }}

    steps:
      - uses: actions/checkout@v4

      - name: Get CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Setup MSVC
        if: matrix.msvc == true
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ contains(matrix.os, 'arm') && 'arm64' || 'x64' }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        env:
          CC: ${{ matrix.cc }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -G "Ninja Multi-Config" -DOTLP_C_BUILD_TESTS=ON -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  alpine-musl:
    name: Alpine ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    container: alpine:3.21
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
        if: matrix.arch == 'x64'
      - uses: taiki-e/checkout-action@v1
        if: matrix.arch == 'arm64'
      - name: Install deps
        run: apk add cmake ninja gcc g++ musl-dev linux-headers
      - name: Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
          cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  freebsd:
    name: FreeBSD 14.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        continue-on-error: true  # INADDR_LOOPBACK visibility quirk; revisit
        with:
          release: 14.2
          usesh: true
          prepare: pkg install -y cmake ninja gcc
          run: |
            set -e
            cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DOTLP_C_BUILD_TESTS=ON
            cmake --build build
            ctest --test-dir build --output-on-failure

  cmake-integration:
    name: CMake find_package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build and install otlp-c
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=${{ github.workspace }}/install
          cmake --build build --config Release
          cmake --install build --config Release
      - name: Test find_package consumer
        shell: bash
        run: |
          mkdir -p consumer-test && cd consumer-test
          cat > main.c << 'EOF'
          #include <otlp-c/otlp.h>
          #include <stdio.h>
          int main(void) { printf("%s\n", otlp_version()); return 0; }
          EOF
          cat > CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer C)
          find_package(otlp-c CONFIG REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE otlp-c::otlp_c)
          enable_testing()
          add_test(NAME consumer_test COMMAND consumer)
          EOF
          cmake -B build -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
          ctest --test-dir build --build-config Release --output-on-failure
