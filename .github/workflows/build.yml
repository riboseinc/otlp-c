name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-13          # Intel
          - macos-14          # Apple Silicon
          - windows-latest

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up CMake + Ninja (Linux + macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --version
          ninja --version || brew install ninja

      - name: Set up CMake + Ninja (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja -y --no-progress

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja \
            -DOTLP_C_BUILD_TESTS=ON \
            -DOTLP_C_BUILD_EXAMPLES=ON \
            -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G "Ninja Multi-Config" `
            -DOTLP_C_BUILD_TESTS=ON `
            -DOTLP_C_BUILD_EXAMPLES=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure
